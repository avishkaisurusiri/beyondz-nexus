<!DOCTYPE html>
<html>
<head>
  <title>Main Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="topbar">
  <div>
    <h2>BeyondZ Nexus</h2>
    <p>Your central gateway to all connected platforms</p>
  </div>

 <div class="top-actions">
  <a href="admin.html" id="adminLink" class="top-auth-btn" style="display:none;">
    Admin Panel
  </a>

  <a href="index.html" id="loginLink" class="top-auth-btn">Login</a>

  <a href="register.html" id="registerLink" class="top-auth-btn primary">
    Register
  </a>

  <button id="logoutBtn" onclick="logout()" style="display:none;">
    Logout
  </button>
</div>
</header>

<main class="dashboard">
  <section class="hero-section">
    <span class="portal-label">Central Portal</span>
    <h1>Access your platforms in one place</h1>
    <p>
      Choose a platform below and continue with its current login or registration process.
      A single BeyondZ login can be connected later.
    </p>
  </section>

  <div class="app-grid" id="appGrid"></div>

</main>

  <script src="app.js"></script>
</body>
</html>
